[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-core"
version = "0.3.6"
description = "A small, standalone Python library for multispectral image stack processing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "MSI Core contributors"}
]
keywords = [
  "multispectral imaging",
  "cultural heritage",
  "image processing",
  "PCA",
  "TIFF"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing"
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "tifffile>=2024.2",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "Pillow>=10.0"
]

[project.scripts]
msi-core = "msi_core.cli:main"

[project.optional-dependencies]
image = [
  "scikit-image>=0.22",
  "opencv-python-headless>=4.9"
]
test = [
  "pytest>=8",
  "pytest-cov>=5"
]
dev = [
  "build>=1.2",
  "ruff>=0.6",
  "mypy>=1.11"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["msi_core*"]

[tool.setuptools.package-data]
msi_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
